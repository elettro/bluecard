  <style>

    .speaker-card{display:flex;flex-direction:column;height:100%;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.09);overflow:hidden;cursor:pointer;border:1px solid rgba(0,75,150,.08);transition:transform .2s ease,box-shadow .2s ease;text-align:left}
    .speaker-card:hover,.speaker-card:focus-within{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.14)}
    .speaker-card-image{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;flex:0 0 auto;background:#eef2f7}
    .speaker-card-body{display:flex;flex-direction:column;flex:1;padding:16px}.speaker-card h3{min-height:28px;margin:0 0 10px;color:#0055a5;font-size:1.05rem;line-height:1.25}
    .speaker-card p,.speaker-card-excerpt{min-height:88px;max-height:88px;overflow:hidden;margin:0 0 16px;color:#4b5563;font-size:.95rem;line-height:1.45}

    .speaker-modal-close{position:sticky;top:14px;float:right;z-index:2;width:42px;height:42px;margin:14px;border-radius:999px;border:0;background:#005eb8;color:#fff;font-size:30px;line-height:1;cursor:pointer}
    .speaker-modal-content{padding:38px}.speaker-modal-content h2{color:#0055a5;font-size:clamp(2rem,4vw,3rem);margin:0 0 8px}
    .speaker-modal-title{color:#374151;font-weight:700;margin-bottom:22px}
    .speaker-modal-hero{width:100%;max-height:420px;object-fit:cover;border-radius:14px;margin:18px 0 28px}

    .speaker-modal-bio{color:#243447;font-size:1rem;line-height:1.75;margin-top:24px}
    .speaker-modal-bio p{margin:0 0 18px}
    .speaker-share-button{display:inline-flex;align-items:center;justify-content:center;background:#005eb8;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800;cursor:pointer;margin-top:24px}
    body.modal-open{overflow:hidden}
    @media (max-width:1050px){.speakers-grid{grid-template-columns:repeat(3,minmax(0,1fr));}}

<script>
(() => {
  const paths = ['../images/speakers-bureau/speakers-bureau-modal.json','../../images/speakers-bureau/speakers-bureau-modal.json'];
  const canonicalSpeakers = [
    { name: 'Inge Auerbacher', slug: 'inge-auerbacher' },
    { name: 'Dr. William Freund', slug: 'dr-william-freund' },
    { name: 'Olga Spiegel', slug: 'olga-spiegel' },
    { name: 'Tom Jacobson', slug: 'tom-jacobson' },
    { name: 'Robert Brajer', slug: 'robert-brajer' },
    { name: 'Goldie Jacoby', slug: 'goldie-jacoby' },
    { name: 'Sami Steigmann', slug: 'sami-steigmann' },
    { name: 'Fred Schoenfeld', slug: 'fred-schoenfeld' },
    { name: 'Lillian Feintuch', slug: 'lillian-feintuch' },
    { name: 'Dolly Rabinovich', slug: 'dolly-rabinovich' },
    { name: 'Sonia Warshawski', slug: 'sonia-warshawski' }
  ];
  const grid = document.getElementById('speakersGrid');
  const modal = document.getElementById('speakerModal');
  const modalContent = document.getElementById('speakerModalContent');
  const closeBtn = modal.querySelector('.speaker-modal-close');
  let speakers = [];

  const slugify = (v='') => v.toLowerCase().trim().replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s-]/g,'').replace(/\s+/g,'-');
  const resolveSpeakerImage = (src) => {
    if (!src) return '';
    if (/^https?:\/\//.test(src)) return src;
    if (src.startsWith('/')) return src;
    if (src.startsWith('/images/')) return src;
    return '/images/speakers-bureau/' + src.replace(/^images\/speakers-bureau\//,'').replace(/^\.\//,'');
  };

  const parseSpeakers = (payload) => Array.isArray(payload) ? payload : Array.isArray(payload?.speakers) ? payload.speakers : Array.isArray(payload?.data) ? payload.data : [];

  const extractFirstJsonArray = (text = '') => {
    const start = text.indexOf('[');
    if (start === -1) return null;
    let depth = 0;
    let inString = false;
    let escaped = false;
    for (let i = start; i < text.length; i += 1) {
      const char = text[i];
      if (inString) {
        if (escaped) escaped = false;
        else if (char === '\\') escaped = true;
        else if (char === '"') inString = false;
        continue;
      }
      if (char === '"') inString = true;
      else if (char === '[') depth += 1;
      else if (char === ']') {
        depth -= 1;
        if (depth === 0) return text.slice(start, i + 1);
      }
    }
    return null;
  };

  const parsePseudoSpeakerObjects = (raw = "") => {
    const objectMatches = String(raw).match(/\{[\s\S]*?\}/g) || [];
    return objectMatches.map((chunk) => {
      const normalized = chunk
        .replace(/""/g, "\"")
        .replace(/([,{]\s*)\"([a-zA-Z0-9_]+)\"\s*:/g, "$1\"$2\":")
        .replace(/:\s*\"null\"/g, ": null");
      try {
        return JSON.parse(normalized);
      } catch (_) {
        return null;
      }
    }).filter(Boolean);
  };

  const parseSpeakerPayload = (payload) => {
    if (Array.isArray(payload) || (payload && typeof payload === 'object')) return payload;
    if (typeof payload !== 'string') return null;
    const cleaned = payload.trim().replace(/^"+|"+$/g, '').replace(/""/g, '"');
    const firstArray = extractFirstJsonArray(cleaned);
    if (firstArray) {
      try {
        return JSON.parse(firstArray);
      } catch (_) {}
    }
    const recovered = parsePseudoSpeakerObjects(cleaned);
    return recovered.length ? recovered : null;
  };

  const speakerImagesBySlug = {
    'inge-auerbacher': 'Inge-Auerbacher.webp',
    'dr-william-freund': 'dr-william-freund-1x1.jpg',
    'olga-spiegel': 'olga-spiegel.webp',
    'tom-jacobson': 'tom-jacobson-picture.webp',
    'robert-brajer': 'robert-brajer.webp',
    'goldie-jacoby': 'goldie-jacoby.webp',
    'sami-steigmann': 'Sami-Steigmann.webp',
    'fred-schoenfeld': 'fred-schoenfeld.webp',
    'lillian-feintuch': 'Lillian Feintuch.png',
    'dolly-rabinovich': 'dolly-rabinovich.webp',
    'sonia-warshawski': 'sonia-warshawski.png'
  };

  const normalizeSpeakerImages = (speaker) => {
    const explicit = speakerImagesBySlug[speaker.slug];
    const resolved = resolveSpeakerImage(explicit || speaker.image1 || speaker.image2 || '');
    return {
      ...speaker,
      image1: resolved,
      image2: resolveSpeakerImage(speaker.image2 || explicit || speaker.image1 || '')
    };
  };

  const getSpeakerBody = (speaker) => speaker.bio || speaker.profile || speaker.description || speaker.content || speaker.text || '';

  const escapeHtml = (value = '') => String(value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');

  const splitBioWithImage = (bodyHtml, image2, speakerName) => {
    const cleanBody = String(bodyHtml || '').trim();
    if (!image2) return `<div class="speaker-modal-bio">${cleanBody}</div>`;

    const imageMarkup = `<img class="speaker-modal-body-image" src="${image2}" alt="${escapeHtml(speakerName)}">`;
    if (cleanBody.includes('</p>')) {
      return `<div class="speaker-modal-bio">${cleanBody.replace('</p>', `</p>${imageMarkup}`)}</div>`;
    }

    const paragraphs = cleanBody
      .split(/\n\s*\n/)
      .map((paragraph) => paragraph.trim())
      .filter(Boolean);

    if (paragraphs.length > 1) {
      const midpoint = Math.ceil(paragraphs.length / 2);
      const firstHalf = paragraphs.slice(0, midpoint).map((p) => `<p>${escapeHtml(p)}</p>`).join('');
      const secondHalf = paragraphs.slice(midpoint).map((p) => `<p>${escapeHtml(p)}</p>`).join('');
      return `<div class="speaker-modal-bio">${firstHalf}${imageMarkup}${secondHalf}</div>`;
    }

    if (cleanBody.includes('<p') || cleanBody.includes('<br') || cleanBody.includes('<div')) {
      return `<div class="speaker-modal-bio">${cleanBody}${imageMarkup}</div>`;
    }

    return `<div class="speaker-modal-bio"><p>${escapeHtml(cleanBody)}</p>${imageMarkup}</div>`;
  };

  const createCard = (speaker) => {
    const card = document.createElement('article');
    card.className = 'speaker-card';
    card.dataset.slug = speaker.slug;
    card.tabIndex = 0;
    const preview = String(getSpeakerBody(speaker)).replace(/\s+/g, ' ').trim().split(' ').slice(0, 22).join(' ');
    card.innerHTML = `${speaker.image1 ? `<img class="speaker-card-image" src="${speaker.image1}" alt="${speaker.name}">` : ''}<div class="speaker-card-body"><h3>${speaker.name || 'Speaker'}</h3>${speaker.title ? `<p>${speaker.title}</p>` : ''}${preview ? `<p class="speaker-card-excerpt">${preview}${preview.split(' ').length >= 22 ? '…' : ''}</p>` : ''}<button class="speaker-card-button" type="button">View Profile</button></div>`;
    card.addEventListener('click', () => openModal(speaker.slug, true));
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openModal(speaker.slug, true);
      }
    });
    const profileButton = card.querySelector('.speaker-card-button');
    profileButton.addEventListener('click', (event) => {
      event.preventDefault();
      event.stopPropagation();
      openModal(speaker.slug, true);
    });
    return card;
  };

  const openModal = (slug, updateHash) => {
    const speaker = speakers.find((s) => s.slug === slug);
    if (!speaker) return;
    const body = getSpeakerBody(speaker);
    const image1 = resolveSpeakerImage(speaker.image1);
    const image2Raw = speaker.image2 ? resolveSpeakerImage(speaker.image2) : '';
    const image2 = image2Raw && image2Raw !== image1 ? image2Raw : '';

    modalContent.innerHTML = `
      <header class="speaker-modal-header">
        <h2 id="speakerModalTitle">${escapeHtml(speaker.name)}</h2>
        ${speaker.title ? `<p class="speaker-modal-title">${escapeHtml(speaker.title)}</p>` : ''}
      </header>
      ${image1 ? `<img class="speaker-modal-hero" src="${image1}" alt="${escapeHtml(speaker.name)}">` : ''}
      <button class="speaker-share-button" type="button">Share Profile</button>
      ${splitBioWithImage(body, image2, speaker.name)}
    `;
    modal.setAttribute('aria-hidden', 'false');
    document.body.classList.add('modal-open');
    closeBtn.focus();
    if (updateHash) history.replaceState(null, '', `#${speaker.slug}`);
    const shareButton = modalContent.querySelector('.speaker-share-button');
    if (shareButton) {
      shareButton.addEventListener('click', async () => {
        const shareUrl = `${window.location.origin}${window.location.pathname}#${speaker.slug}`;
        try {
          await navigator.clipboard.writeText(shareUrl);
          shareButton.textContent = 'Link Copied';
          setTimeout(() => {
            shareButton.textContent = 'Share Profile';
          }, 1800);
        } catch (error) {
          window.prompt('Copy this profile link:', shareUrl);
        }
      });
    }
  };

  const closeModal = () => {
    modal.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('modal-open');
    history.pushState('', document.title, window.location.pathname);
  };

  modal.addEventListener('click', (e) => { if (e.target.matches('[data-close-modal]')) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && modal.getAttribute('aria-hidden') === 'false') closeModal(); });

  const render = () => {
    grid.innerHTML = '';
    speakers.forEach((speaker) => grid.appendChild(createCard(speaker)));
    window.__bluecardSpeakers = speakers.map((s) => ({ name: s.name, slug: s.slug }));
    window.dispatchEvent(new CustomEvent('bluecard:speakers-loaded', { detail: window.__bluecardSpeakers }));
  };

  (async () => {
    let payload;
    for (const path of paths) {
      try { const r = await fetch(path); if (r.ok) { payload = parseSpeakerPayload(await r.text()); break; } } catch (_) {}
    }
    let source = parseSpeakers(payload);
    const canonicalBySlug = new Map(canonicalSpeakers.map((speaker) => [speaker.slug, speaker.name]));
    speakers = source
      .map((s) => ({ ...s, slug: s.slug ? slugify(s.slug) : slugify(s.name || '') }))
      .filter((s) => s.name)
      .map((s) => ({ ...s, name: canonicalBySlug.get(s.slug) || s.name }))
      .slice(0, 11)
      .map(normalizeSpeakerImages);

    if (!speakers.length) {
      speakers = canonicalSpeakers.map((speaker) => normalizeSpeakerImages({ ...speaker, title: '', image1: '', image2: '' }));
    } else {
      const bySlug = new Map(speakers.map((speaker) => [speaker.slug, speaker]));
      speakers = canonicalSpeakers.map((speaker) => {
        const found = bySlug.get(speaker.slug);
        return normalizeSpeakerImages(found ? { ...found, ...speaker } : { ...speaker, title: '', image1: '', image2: '' });
      });
    }
    render();
    const hash = window.location.hash.replace('#', '');
    if (hash) openModal(hash, false);
  })();

  window.addEventListener('hashchange', () => {
    const hash = window.location.hash.replace('#', '');
    if (!hash) return closeModal();
    openModal(hash, false);
  });
})();
</script>
</body>
</html>
