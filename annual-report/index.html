  <style>
    .annual-report-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    .annual-report-card {
      background: #fff;
      border: 1px solid #d7dde5;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.12);
    }

    .annual-report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .annual-report-title {
      margin: 0;
      color: #0f2f5f;
      font-size: clamp(1.5rem, 4vw, 2rem);
      line-height: 1.2;
      font-family: "Georgia", "Times New Roman", serif;
    }

    .report-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      border: 1px solid #17437d;
      background: #17437d;
      color: #fff;
    }

    .report-btn:hover,
    .report-btn:focus-visible {
      background: #0f2f5f;
      border-color: #0f2f5f;
    }

    .report-viewer {
      border: 1px solid #c9d4e4;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .report-viewer iframe {
      width: 100%;
      height: min(78vh, 980px);
      min-height: 520px;
      border: 0;
      display: block;
    }

    .fallback-note {
      margin-top: 0.85rem;
      color: #374151;
      font-size: 0.95rem;
    }
  </style>
