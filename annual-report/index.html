<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Annual Report | The Blue Card</title>
  <link rel="stylesheet" href="../global-layout.css">
  <style>
    .annual-report-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }

    .annual-report-card {
      background: #fff;
      border: 1px solid #d7dde5;
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.12);
    }

    .annual-report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .annual-report-title {
      margin: 0;
      color: #0f2f5f;
      font-size: clamp(1.5rem, 4vw, 2rem);
      line-height: 1.2;
      font-family: "Georgia", "Times New Roman", serif;
    }

    .report-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 999px;
      padding: 0.6rem 1rem;
      font-weight: 600;
      border: 1px solid #17437d;
      background: #17437d;
      color: #fff;
    }

    .report-btn:hover,
    .report-btn:focus-visible {
      background: #0f2f5f;
      border-color: #0f2f5f;
    }

    .report-viewer {
      border: 1px solid #c9d4e4;
      border-radius: 10px;
      overflow: hidden;
      background: #fff;
    }

    .report-viewer iframe {
      width: 100%;
      height: min(78vh, 980px);
      min-height: 520px;
      border: 0;
      display: block;
    }

    .fallback-note {
      margin-top: 0.85rem;
      color: #374151;
      font-size: 0.95rem;
    }
  </style>
</head>
<body class="bg-background text-on-surface font-body">
<header id="bc-global-nav" aria-label="Global site navigation"></header>
<main>
  <section class="annual-report-wrap">
    <div class="annual-report-card">
      <div class="annual-report-header">
        <h1 class="annual-report-title">Annual Report</h1>
        <a class="report-btn" href="/bluecard/pdfs/The-Blue-Card-Report-to-the-Community-2023.pdf" download>Download PDF</a>
      </div>

      <div class="report-viewer">
        <iframe
          title="The Blue Card Annual Report PDF"
          src="/bluecard/pdfs/The-Blue-Card-Report-to-the-Community-2023.pdf#view=FitH"
        ></iframe>
      </div>

      <p class="fallback-note">
        If the PDF does not display in your browser, you can
        <a href="/bluecard/pdfs/The-Blue-Card-Report-to-the-Community-2023.pdf" target="_blank" rel="noopener noreferrer">open it in a new tab</a>
        or use the download button above.
      </p>
    </div>
  </section>
</main>
<footer id="bc-global-footer" aria-label="Global site footer"></footer>
<script src="../global-layout.js" defer></script>
</body>
</html>
