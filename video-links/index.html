<style>body.video-modal-open{overflow:hidden}.video-links-page{--bc-blue:#005eb8;--bc-blue-dark:#003f7d;--bc-soft:#edf4ff;--bc-text:#1f2d3d;--bc-muted:#566274;background:linear-gradient(180deg,#f9fcff 0%,#eff5fb 100%);padding:30px 16px 70px;color:var(--bc-text);font-family:Arial,Helvetica,sans-serif}.video-links-page *{box-sizing:border-box}.video-links-page .wrap{max-width:1280px;margin:0 auto}.video-hero{background:#fff;border:1px solid rgba(0,75,150,.12);border-radius:24px;box-shadow:0 14px 30px rgba(0,63,125,.12);padding:30px}.video-hero h1{margin:0;color:var(--bc-blue-dark);font-size:clamp(2rem,4vw,3.4rem)}.video-hero h2{margin:8px 0 0;color:#0b56a4;font-size:clamp(1.15rem,2vw,1.6rem)}.video-hero p{margin:18px 0 0;max-width:920px;line-height:1.7;color:var(--bc-muted)}.video-hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.video-btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 18px;border-radius:999px;font-weight:700;text-decoration:none}.video-btn.primary{background:var(--bc-blue);color:#fff}.video-btn.secondary{background:#fff;border:1px solid #9ec0e9;color:var(--bc-blue-dark)}.video-featured,.video-library{margin-top:32px;background:#fff;border:1px solid rgba(0,75,150,.1);border-radius:22px;padding:24px;box-shadow:0 10px 24px rgba(0,63,125,.08)}.video-featured h3,.video-library h3{margin:0 0 14px;color:var(--bc-blue-dark);font-size:clamp(1.4rem,2.2vw,2rem)}.video-embed,.video-modal-frame-wrap{position:relative;width:100%;aspect-ratio:16 / 9;overflow:hidden;border-radius:16px;background:#001f3f}.video-embed iframe,.video-modal-frame-wrap iframe{width:100%;height:100%;display:block}.video-featured-meta h4{margin:16px 0 6px;font-size:1.25rem;color:#0b56a4}.video-featured-meta p{margin:0;color:var(--bc-muted);line-height:1.65}.video-filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 20px}.video-filter-button{border:1px solid #bcd3ef;background:#f2f8ff;color:#004c95;padding:8px 12px;border-radius:999px;font-weight:700;cursor:pointer}.video-filter-button.is-active{background:var(--bc-blue);color:#fff;border-color:var(--bc-blue)}.video-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.video-card{display:flex;flex-direction:column;background:#fff;border:1px solid rgba(0,75,150,.1);border-radius:16px;overflow:hidden;box-shadow:0 8px 18px rgba(0,63,125,.08);cursor:pointer}.video-card-thumb{aspect-ratio:16/9;width:100%;object-fit:cover;display:block;background:#d7e8fb}.video-card-body{padding:14px;display:flex;flex-direction:column;flex:1}.video-card h4{margin:0 0 8px;color:#003f7d;font-size:1.08rem}.video-card p{margin:0 0 14px;color:var(--bc-muted);line-height:1.55;font-size:.95rem}.video-category-pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#eaf3ff;color:#004f99;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}.video-card button{margin-top:auto;background:var(--bc-blue);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}.video-modal{position:fixed;inset:0;z-index:9999;display:none}.video-modal[aria-hidden="false"]{display:block}.video-modal-backdrop{position:absolute;inset:0;background:rgba(0,20,46,.74)}.video-modal-panel{position:relative;width:min(980px,calc(100% - 24px));margin:22px auto;background:#fff;border-radius:18px;padding:16px;max-height:calc(100vh - 44px);overflow-y:auto}.video-modal-close{position:absolute;top:10px;right:10px;background:#005eb8;border:0;color:#fff;width:38px;height:38px;border-radius:999px;font-size:28px;cursor:pointer}.video-modal-content h2{margin:14px 0 8px;color:#003f7d}.video-modal-content p{margin:0;color:#54657a;line-height:1.6}@media (max-width:980px){.video-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:700px){.video-hero{padding:22px}.video-grid{grid-template-columns:1fr}}</style>

<header id="bc-global-nav" aria-label="Global site navigation"></header>
<main class="video-links-page"><div class="wrap"><section class="video-hero"><h1>Video Links</h1><h2>Stories, programs, and conversations from The Blue Card.</h2><p>Explore videos highlighting Holocaust survivor support, educational programs, interviews, community events, and the ongoing mission of The Blue Card.</p><div class="video-hero-actions"><a class="video-btn primary" href="#featuredVideo">Watch Featured Video</a><a class="video-btn secondary" href="/bluecard/contact/" target="_blank" rel="noopener noreferrer">Contact The Blue Card</a></div></section><section class="video-featured" id="featuredVideo"><h3>Featured Video</h3><div class="video-embed"><iframe id="featuredVideoIframe" src="" title="Featured Blue Card Video" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="video-featured-meta"><h4 id="featuredVideoTitle"></h4><p id="featuredVideoDescription"></p></div></section><section class="video-library"><h3>Video Library</h3><div class="video-filter-bar" id="videoFilterBar"></div><div class="video-grid" id="videoGrid"></div></section></div></main>
<div class="video-modal" id="videoModal" aria-hidden="true"> <div class="video-modal-backdrop" data-close-video-modal></div> <article class="video-modal-panel" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle"> <button class="video-modal-close" type="button" aria-label="Close video" data-close-video-modal>×</button> <div class="video-modal-frame-wrap"> <iframe id="videoModalIframe" src="" title="YouTube video player" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe> </div> <div class="video-modal-content"> <h2 id="videoModalTitle"></h2> <p id="videoModalDescription"></p> </div> </article> </div>

<script>
const blueCardVideos=[{title:"Honoring Holocaust Survivors – International Holocaust Remembrance Day Webinar Recording",description:"Webinar recording honoring Holocaust survivors.",youtubeUrl:"https://youtu.be/WJ0nKtfnSoQ",category:"Webinar"},{title:"Holocaust Survivors Australia trauma-Masha Pearl/Talkline With Zev Brenner",description:"Conversation featuring Masha Pearl with Holocaust Survivors Australia.",youtubeUrl:"https://www.youtube.com/watch?v=Yafi5-e4QP4",category:"Holocaust Survivors Australia"},{title:"Survivor Mitzvah Project: Why We Go (2025)",description:"Survivor Mitzvah Project video #1.",youtubeUrl:"https://youtu.be/G74u8JtImR4",category:"Survivor Mitzvah Project"},{title:"Survivor Mitzvah Project: Be A Champion of Compassion",description:"Survivor Mitzvah Project video #2.",youtubeUrl:"https://youtu.be/pFmvu0IELIo",category:"Survivor Mitzvah Project"},{title:"Latet: Sophia’s Story",description:"Latet video #1.",youtubeUrl:"https://www.youtube.com/watch?v=X65wou_ETvM&t=2s",category:"Latet"},{title:"Latet: Anna’s Story",description:"Latet video #2.",youtubeUrl:"https://www.youtube.com/watch?v=Nlquybknp6o",category:"Latet"},{title:"Latet: Yehudit’s Story",description:"Latet video #3.",youtubeUrl:"https://www.youtube.com/watch?v=Sch7U2VCKao",category:"Latet"},{title:"The Blue Card: What is The Blue Card?",description:"The Blue Card video #1.",youtubeUrl:"https://youtu.be/yCq1YhB9OCA",category:"The Blue Card"},{title:"The Blue Card: Meet Sonia",description:"The Blue Card video #2.",youtubeUrl:"https://youtu.be/bndDX76e1mI",category:"The Blue Card"}];
function getYouTubeId(url){const value=String(url||'');const patterns=[/youtube.com\/watch\?v=([^&]+)/,/youtu.be\/([^?]+)/,/youtube.com\/embed\/([^?]+)/];for(const pattern of patterns){const match=value.match(pattern);if(match&&match[1])return match[1];}return value;}
function getYouTubeThumbnail(url){const id=getYouTubeId(url);return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;}
function getYouTubeEmbed(url){const id=getYouTubeId(url);return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;}
(()=>{const filterLabels=["All Videos",...Array.from(new Set(blueCardVideos.map(v=>v.category)))];const featured=blueCardVideos[0];const grid=document.getElementById('videoGrid');const filterBar=document.getElementById('videoFilterBar');const modal=document.getElementById('videoModal');const modalIframe=document.getElementById('videoModalIframe');const modalTitle=document.getElementById('videoModalTitle');const modalDescription=document.getElementById('videoModalDescription');let activeFilter="All Videos";const renderFilters=()=>{filterBar.innerHTML='';filterLabels.forEach(label=>{const b=document.createElement('button');b.className='video-filter-button'+(label===activeFilter?' is-active':'');b.textContent=label;b.type='button';b.addEventListener('click',()=>{activeFilter=label;renderFilters();renderGrid();});filterBar.appendChild(b);});};const openVideo=video=>{modalTitle.textContent=video.title;modalDescription.textContent=video.description;modalIframe.src=getYouTubeEmbed(video.youtubeUrl);modal.setAttribute('aria-hidden','false');document.body.classList.add('video-modal-open');};const closeVideo=()=>{modal.setAttribute('aria-hidden','true');modalIframe.src='';document.body.classList.remove('video-modal-open');};const renderGrid=()=>{const list=activeFilter==='All Videos'?blueCardVideos:blueCardVideos.filter(v=>v.category===activeFilter);grid.innerHTML='';list.forEach(video=>{const c=document.createElement('article');c.className='video-card';c.innerHTML=`<img class="video-card-thumb" src="${getYouTubeThumbnail(video.youtubeUrl)}" alt="${video.title}"><div class="video-card-body"><span class="video-category-pill">${video.category}</span><h4>${video.title}</h4><p>${video.description}</p><button type="button">Watch Video</button></div>`;c.addEventListener('click',()=>openVideo(video));c.querySelector('button').addEventListener('click',e=>{e.stopPropagation();openVideo(video);});grid.appendChild(c);});};document.querySelectorAll('[data-close-video-modal]').forEach(el=>el.addEventListener('click',closeVideo));document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.getAttribute('aria-hidden')==='false')closeVideo();});document.getElementById('featuredVideoIframe').src=`https://www.youtube.com/embed/${getYouTubeId(featured.youtubeUrl)}?rel=0`;document.getElementById('featuredVideoTitle').textContent=featured.title;document.getElementById('featuredVideoDescription').textContent=featured.description;renderFilters();renderGrid();})();
</script>
