name: Add global nav hover underline

on:
  push:
    paths:
      - '.github/add-global-nav-hover-underline-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  add-underline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add animated underline to top-level navigation
        run: python scripts/add_global_nav_hover_underline.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.css global-layout-base.js global-layout.js '*.html' '**/*.html'
          git commit -m "Animate underline on top-level navigation hover"
          git push
