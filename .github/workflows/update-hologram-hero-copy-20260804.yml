name: Update hologram hero copy

on:
  push:
    paths:
      - '.github/update-hologram-hero-copy-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero paragraph and add callout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('interactive-hologram/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'(<h1>Book the Interactive Hologram Experience\.</h1>\s*)'
              r'<p>.*?</p>\s*'
              r'(?:<div class="bc-hero-callout".*?</div>\s*)?'
              r'(<div class="bc-hero-actions">)',
              re.S,
          )

          replacement = r'''\1<p>
            The Blue Card brings Holocaust education to schools, organizations, community centers, and workplaces through a free <strong>non-generative</strong> AI-powered hologram program featuring <strong>Holocaust survivor</strong> Sonia Warshawski.
          </p>

          <div class="bc-hero-callout" role="note" style="max-width:650px;margin-top:22px;padding:18px 22px;border-radius:18px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-left:5px solid #fff;color:#fff;font-size:clamp(17px,1.8vw,20px);font-weight:800;line-height:1.45;box-shadow:0 16px 36px rgba(3,15,50,.22);backdrop-filter:blur(10px);">
            It’s an opportunity for students to meet a real survivor, and hear her real voice.
          </div>

          \2'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Hero content pattern matched {count} times')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Add student callout to hologram hero"
          git push
