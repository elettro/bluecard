name: Import Georgi 2026 PDFs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-georgi-2026-pdfs.yml'
permissions:
  contents: write
jobs:
  import-verified-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify the exact two 2026 Blue Card PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pdfs
          curl --fail --location --silent --show-error --retry 2 \
            'https://thebluecard-my.sharepoint.com/:b:/g/personal/georgi_bluecardfund_org/IQDLFOqfKPYrTK1GZqq4KfSrAYaKGZvGvCsF_JXBOmuKK5U?e=KPzOvP&download=1' \
            -o pdfs/2026-Blue-Card-Referral-Application-Official.pdf
          curl --fail --location --silent --show-error --retry 2 \
            'https://thebluecard-my.sharepoint.com/:b:/g/personal/georgi_bluecardfund_org/IQCDHmAOAwtcR5DYzIZgmuV2AWwSXl-EuBGITikP0Uld-H4?e=UZvkAa&download=1' \
            -o pdfs/2026-Blue-Card-Recertification-Application-Official.pdf
          python3 - <<'PY'
          import hashlib, pathlib
          expected = {
              'pdfs/2026-Blue-Card-Referral-Application-Official.pdf': '9641e57543fe50409381940991405c634b8f4e9f395b36532a2344cf38253901',
              'pdfs/2026-Blue-Card-Recertification-Application-Official.pdf': 'cc3744c456d610eca8358680340183c676ab237334bc00986cbe39692ee05dba',
          }
          for name, digest in expected.items():
              payload = pathlib.Path(name).read_bytes()
              assert payload.startswith(b'%PDF-'), f'Not a PDF: {name}'
              actual = hashlib.sha256(payload).hexdigest()
              assert actual == digest, f'Checksum mismatch: {name} ({actual})'
              print(f'Verified {name} ({len(payload)} bytes)')
          PY
      - name: Commit verified PDF downloads to Blue Card
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pdfs/2026-Blue-Card-Referral-Application-Official.pdf pdfs/2026-Blue-Card-Recertification-Application-Official.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Blue Card: host original 2026 application PDFs'
            git push
          fi
