name: Set global nav underline white

on:
  push:
    paths:
      - '.github/set-global-nav-underline-white-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change global navigation underline to white
        run: python scripts/set_global_nav_underline_white.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.css '*.html' '**/*.html'
          git commit -m "Change global navigation underline to white"
          git push
