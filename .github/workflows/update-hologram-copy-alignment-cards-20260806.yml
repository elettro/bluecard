name: Update hologram copy alignment and cards

on:
  push:
    paths:
      - '.github/update-hologram-copy-alignment-cards-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  update-hologram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hologram copy alignment and cards
        run: python scripts/update_hologram_copy_alignment_cards.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html global-layout.js homepage-how-we-help.js
          git commit -m "Update hologram copy alignment and benefit cards"
          git push
