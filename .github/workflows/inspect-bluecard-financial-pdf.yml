name: Inspect Blue Card combined financial PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-bluecard-financial-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF inspection library
        run: python3 -m pip install -q pypdf
      - name: Inspect combined PDF page identity
        run: |
          python3 - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p=Path('pdfs/Audit-990-and-Char500-The-Blue-Card.pdf')
          r=PdfReader(str(p))
          print('COMBINED PAGE COUNT:',len(r.pages),flush=True)
          print('COMBINED METADATA:',r.metadata,flush=True)
          for i,page in enumerate(r.pages):
              t=(page.extract_text() or '').replace('\n',' ')
              terms=[w for w in ('2024','2023','2025','CHAR500','INDEPENDENT','AUDITOR','FORM 990','AUDITED','FINANCIAL STATEMENTS') if w.lower() in t.lower()]
              print('PAGE',i+1,'TERMS',','.join(terms),'START',t[:210].strip(),flush=True)
          PY
