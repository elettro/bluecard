name: Inspect Blue Card combined financial PDF
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-bluecard-financial-pdf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Identify original sections without modifying source file
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('pdfs/Audit-990-and-Char500-The-Blue-Card.pdf')
          assert p.exists()
          print('SOURCE SIZE',p.stat().st_size, flush=True)
          print(subprocess.run(['pdfinfo',str(p)],capture_output=True,text=True).stdout[:1100],flush=True)
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
            subprocess.run(['pdftotext','-layout',str(p),tmp+'/text.txt'],check=True)
            txt=Path(tmp+'/text.txt').read_text(errors='replace')
            pages=txt.split('\f')
            for i,page in enumerate(pages,1):
              if not page.strip():continue
              lines=[x.strip() for x in page.splitlines() if x.strip()]
              print(f'PAGE {i:02d}: '+' | '.join(lines[:4])[:220],flush=True)
          PY
