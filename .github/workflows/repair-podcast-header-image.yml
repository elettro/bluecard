name: Repair podcast header image
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/repair-podcast-header-image.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download actual podcast header
        run: |
          python - <<'PY'
          import base64, pathlib
          data = '''[... ELLIPSIZATION ...]'''
          raw = base64.b64decode(data)
          p = pathlib.Path('images/podcast/the-blue-card-podcast-v2.jpg')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_bytes(raw)
          PY
      - name: Point podcast page to repaired JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('podcast/index.html')
          s = p.read_text()
          s = s.replace('/bluecard/images/podcast/the-blue-card-podcast-v2.webp','/bluecard/images/podcast/the-blue-card-podcast-v2.jpg?v=20260812-1457')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'elettro'
          git config user.email 'dpalermo@elettro.com'
          git add images/podcast/the-blue-card-podcast-v2.jpg podcast/index.html
          git commit -m 'Repair podcast header image binary' || exit 0
          git push
