name: Fit endorsement letters on mobile

on:
  push:
    paths:
      - '.github/fix-mobile-endorsement-preview-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  fix-mobile-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shrink full endorsement pages on mobile
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('homepage-how-we-help.js')
          text = path.read_text(encoding='utf-8')

          old = ".bc-letter-preview{aspect-ratio:8.5/10.5}}"
          new = ".bc-letter-preview{aspect-ratio:8.5/11;padding:10px}.bc-letter-preview iframe{width:125%;height:125%;transform:scale(.8);transform-origin:top left}}"

          if old not in text:
              raise SystemExit('Mobile endorsement preview CSS marker not found')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-how-we-help.js
          git commit -m "Fit full endorsement letters on mobile"
          git push
