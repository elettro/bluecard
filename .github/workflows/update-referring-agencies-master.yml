name: Update Referring Agencies Master List

on:
  push:
    paths:
      - '.github/workflows/update-referring-agencies-master.yml'

permissions:
  contents: write

jobs:
  update-agencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace referring agencies data
        shell: python
        env:
          PAYLOAD: 
        run: |
          import os, base64, gzip
          from pathlib import Path
          content = gzip.decompress(base64.b64decode(os.environ['PAYLOAD'])).decode('utf-8')
          Path('referring-agencies/referring-agencies-data.js').write_text(content, encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add referring-agencies/referring-agencies-data.js
          git commit -m "Replace referring agencies with master list"
          git push
