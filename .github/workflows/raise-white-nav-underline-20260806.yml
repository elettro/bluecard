name: Raise white nav underline

on:
  push:
    paths:
      - '.github/raise-white-nav-underline-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Raise underline and refresh CSS cache
        run: python scripts/raise_white_nav_underline.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.css '*.html' '**/*.html'
          git commit -m "Raise white navigation underline"
          git push
