name: Set navigation underline blue

on:
  push:
    paths:
      - '.github/set-nav-underline-blue-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  set-blue-underline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change navigation underline to Blue Card blue
        run: python scripts/set_nav_underline_blue.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.css global-layout-base.js global-layout.js '*.html' '**/*.html'
          git commit -m "Change navigation underline to Blue Card blue"
          git push
