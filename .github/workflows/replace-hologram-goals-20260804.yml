name: Replace hologram goals section

on:
  push:
    paths:
      - '.github/replace-hologram-goals-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  update-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace goals with grades 6 and up benefits
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('interactive-hologram/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'    <section class="bc-section bc-section-light" id="goals">.*?    </section>\n\n    <section class="bc-section bc-section-soft" id="meet-sonia">',
              re.S,
          )

          replacement = '''    <section class="bc-section bc-section-light bc-student-benefits" id="goals">
      <style>
        .bc-student-benefits .bc-section-head {
          max-width: 980px;
          margin-bottom: 42px;
        }
        .bc-student-benefits .bc-section-head h2 {
          max-width: 900px;
        }
        .bc-student-benefits-grid {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 20px;
        }
        .bc-student-benefit {
          position: relative;
          overflow: hidden;
          min-height: 245px;
          padding: 30px;
          border-radius: 24px;
          background: linear-gradient(180deg, #ffffff 0%, #f4f8ff 100%);
          border: 1px solid rgba(37, 71, 155, .16);
          box-shadow: 0 14px 34px rgba(14, 32, 79, .09);
        }
        .bc-student-benefit::before {
          content: '';
          position: absolute;
          inset: 0 auto 0 0;
          width: 6px;
          background: linear-gradient(180deg, #25479b, #9d1f1f);
        }
        .bc-student-benefit-icon {
          width: 54px;
          height: 54px;
          display: grid;
          place-items: center;
          margin-bottom: 20px;
          border-radius: 17px;
          background: #e8efff;
          color: #25479b;
          font-size: 24px;
          font-weight: 900;
        }
        .bc-student-benefit h3 {
          margin: 0 0 12px;
          color: var(--bc-blue-dark);
          font-size: 22px;
          line-height: 1.16;
        }
        .bc-student-benefit p {
          margin: 0;
          color: #52617e;
          font-size: 16px;
          line-height: 1.62;
        }
        @media (max-width: 980px) {
          .bc-student-benefits-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
          }
        }
        @media (max-width: 640px) {
          .bc-student-benefits-grid {
            grid-template-columns: 1fr;
          }
          .bc-student-benefit {
            min-height: 0;
          }
        }
      </style>
      <div class="bc-container">
        <div class="bc-section-head">
          <div class="bc-section-kicker">Designed for the Classroom</div>
          <h2>Why this program is ideal for students grades 6 and up</h2>
        </div>

        <div class="bc-student-benefits-grid">
          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">01</div>
            <h3>Enriches existing curricula</h3>
            <p>Complements humanities, ethics, ELA, social studies, and civics programs with a unique, immersive learning tool.</p>
          </article>

          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">02</div>
            <h3>Interactive survivor testimony</h3>
            <p>Offers students a rare opportunity to connect personally with a Holocaust survivor and Holocaust history.</p>
          </article>

          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">03</div>
            <h3>Cutting-edge technology</h3>
            <p>Uses a non-generative AI model that is the first of its kind to exist in the classroom.</p>
          </article>

          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">04</div>
            <h3>Flexible integration</h3>
            <p>Sessions can be tailored to fit your school’s schedule and teaching style.</p>
          </article>

          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">05</div>
            <h3>Free access</h3>
            <p>Provided at no cost, ensuring equitable participation across independent schools.</p>
          </article>

          <article class="bc-student-benefit">
            <div class="bc-student-benefit-icon" aria-hidden="true">06</div>
            <h3>Measurable impact</h3>
            <p>Pre- and post-session surveys demonstrate student growth in empathy, understanding, and civic responsibility.</p>
          </article>
        </div>
      </div>
    </section>

    <section class="bc-section bc-section-soft" id="meet-sonia">'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Goals section matched {count} times')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Replace hologram goals with student benefits"
          git push
