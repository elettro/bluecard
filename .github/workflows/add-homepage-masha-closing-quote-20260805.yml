name: Add homepage Masha closing quote

on:
  push:
    paths:
      - '.github/add-homepage-masha-closing-quote-trigger-20260805.txt'

permissions:
  contents: write

jobs:
  add-closing-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add closing quote mark
        run: python scripts/add_homepage_masha_closing_quote.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.js index.html
          git commit -m "Add closing quote to homepage Masha section"
          git push
