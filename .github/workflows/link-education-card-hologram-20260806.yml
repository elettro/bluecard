name: Link education card to hologram page

on:
  push:
    paths:
      - '.github/link-education-card-hologram-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  update-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update education card link
        run: python scripts/link_education_card_to_hologram.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add homepage-how-we-help.js global-layout.js
          git commit -m "Link education card to interactive hologram page"
          git push
