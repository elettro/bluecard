name: Refine mobile hologram controls

on:
  push:
    paths:
      - '.github/refine-mobile-hologram-controls-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  refine-mobile-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make mobile hero controls compact and add spacing
        run: python scripts/refine_mobile_hologram_controls.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Refine mobile hologram hero controls"
          git push
