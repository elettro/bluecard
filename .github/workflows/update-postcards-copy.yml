name: Add Holocaust education press cards

on:
  push:
    paths:
      - '.github/workflows/update-postcards-copy.yml'

permissions:
  contents: write

jobs:
  update-press:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add press section below program pillars
        shell: python
        run: |
          from pathlib import Path
          path = Path('global-layout-legacy.js')
          text = path.read_text()
          if 'bc-education-press-grid' in text:
              print('Press section already present')
          else:
              old = '''    <div class="bc-history-pillars" aria-label="Program pillars"><span>Educate</span><span class="bc-history-pillar-star" aria-hidden="true">★</span><span>Reflect</span><span class="bc-history-pillar-star" aria-hidden="true">★</span><span>Inspire</span></div>
  </div>
</div>'''
              new = '''    <div class="bc-history-pillars" aria-label="Program pillars"><span>Educate</span><span class="bc-history-pillar-star" aria-hidden="true">★</span><span>Reflect</span><span class="bc-history-pillar-star" aria-hidden="true">★</span><span>Inspire</span></div>
  </div>
  <section class="bc-education-press" aria-labelledby="bc-education-press-title">
    <style>
      .bc-education-press{padding:54px 0 0}.bc-education-press h3{margin:0 0 26px;color:#17306f;font-size:clamp(28px,3vw,40px);line-height:1.08;letter-spacing:-.025em}.bc-education-press-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.bc-education-press-card{display:flex;flex-direction:column;min-height:285px;padding:24px;border-radius:22px;background:#fff;border:1px solid rgba(37,71,155,.14);box-shadow:0 12px 34px rgba(14,32,79,.10);transition:transform .2s ease,box-shadow .2s ease}.bc-education-press-card:hover{transform:translateY(-4px);box-shadow:0 18px 44px rgba(14,32,79,.16)}.bc-education-press-brand{display:flex;align-items:center;gap:11px;min-height:44px;margin-bottom:20px}.bc-education-press-brand img{width:38px;height:38px;object-fit:contain;border-radius:8px}.bc-education-press-brand span{color:#17306f;font-size:15px;font-weight:900}.bc-education-press-card h4{margin:0 0 18px;color:#17306f;font-size:19px;line-height:1.3}.bc-education-press-card .bc-education-press-cta{margin-top:auto;color:#25479b;font-size:14px;font-weight:900}.bc-education-press-card .bc-education-press-cta::after{content:' →'}@media(max-width:980px){.bc-education-press-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.bc-education-press{padding-top:42px}.bc-education-press-grid{grid-template-columns:1fr}.bc-education-press-card{min-height:0}}
    </style>
    <h3 id="bc-education-press-title">See our Holocaust education program in the press!</h3>
    <div class="bc-education-press-grid">
      <a class="bc-education-press-card" href="https://jewishlink.news/holocaust-survivors-hologram-offers-new-way-to-reach-students/" target="_blank" rel="noopener noreferrer">
        <div class="bc-education-press-brand"><img src="https://www.google.com/s2/favicons?domain=jewishlink.news&sz=128" alt="Jewish Link logo"><span>Jewish Link</span></div>
        <h4>Holocaust Survivor’s Hologram Offers New Way to Reach Students</h4>
        <span class="bc-education-press-cta">Read the article</span>
      </a>
      <a class="bc-education-press-card" href="https://www.tapinto.net/towns/edison/articles/middlesex-college-gets-powerful-virtual-visit-from-holocaust-survivor" target="_blank" rel="noopener noreferrer">
        <div class="bc-education-press-brand"><img src="https://www.google.com/s2/favicons?domain=tapinto.net&sz=128" alt="TAPinto logo"><span>TAPinto Edison</span></div>
        <h4>Middlesex College Gets Powerful Virtual Visit from Holocaust Survivor</h4>
        <span class="bc-education-press-cta">Read the article</span>
      </a>
      <a class="bc-education-press-card" href="https://forward.com/news/805093/holocaust-education-ai-sonia-warshawski-blue-card" target="_blank" rel="noopener noreferrer">
        <div class="bc-education-press-brand"><img src="https://www.google.com/s2/favicons?domain=forward.com&sz=128" alt="The Forward logo"><span>The Forward</span></div>
        <h4>As the Last Generation of Holocaust Survivors Die, Is AI the Future of Holocaust Education?</h4>
        <span class="bc-education-press-cta">Read the article</span>
      </a>
      <a class="bc-education-press-card" href="https://youtu.be/Z7srns3EqNw" target="_blank" rel="noopener noreferrer">
        <div class="bc-education-press-brand"><img src="https://www.google.com/s2/favicons?domain=youtube.com&sz=128" alt="YouTube logo"><span>YouTube</span></div>
        <h4>Watch Coverage of The Blue Card Holocaust Education Program</h4>
        <span class="bc-education-press-cta">Watch the video</span>
      </a>
    </div>
  </section>
</div>'''
              if old not in text:
                  raise SystemExit('History pillar anchor not found')
              path.write_text(text.replace(old, new, 1))
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout-legacy.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Holocaust education press cards"
            git push
          fi
