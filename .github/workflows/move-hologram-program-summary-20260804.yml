name: Move hologram program summary

on:
  push:
    paths:
      - '.github/move-hologram-program-summary-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  move-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Move Program Summary above global footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('interactive-hologram/index.html')
          text = path.read_text(encoding='utf-8')

          pattern = re.compile(
              r'\n\s*<section class="ai-answer-block" aria-labelledby="program-summary-title">.*?</section>\s*(?=<main>)',
              re.S,
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('Program Summary section was not found in its current location.')

          section = match.group(0).strip()
          text = text[:match.start()] + '\n\n' + text[match.end():]

          footer = '  <footer id="bc-global-footer" aria-label="Global site footer"></footer>'
          if footer not in text:
              raise SystemExit('Global footer anchor was not found.')

          if text.count('id="program-summary-title"') != 0:
              raise SystemExit('Program Summary still exists before reinsertion.')

          text = text.replace(footer, f'  {section}\n\n{footer}', 1)

          if text.count('id="program-summary-title"') != 1:
              raise SystemExit('Program Summary must appear exactly once after the move.')

          summary_pos = text.index('id="program-summary-title"')
          footer_pos = text.index('id="bc-global-footer"')
          main_close_pos = text.rfind('</main>', 0, footer_pos)
          if not (main_close_pos < summary_pos < footer_pos):
              raise SystemExit('Program Summary was not placed between the main content and global footer.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit moved Program Summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Move hologram Program Summary above footer"
          git push
