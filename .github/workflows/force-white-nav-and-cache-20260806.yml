name: Force white nav underline and cache refresh

on:
  push:
    paths:
      - '.github/force-white-nav-and-cache-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply white underline and cache refresh
        run: python scripts/force_white_nav_underline_and_bust_cache.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.css '*.html' '**/*.html'
          git commit -m "Force white nav underline and refresh global CSS cache"
          git push
