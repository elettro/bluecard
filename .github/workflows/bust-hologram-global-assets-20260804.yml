name: Refresh hologram global assets

on:
  push:
    paths:
      - '.github/bust-hologram-global-assets-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  refresh-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add cache-busting asset versions
        run: python scripts/bust_hologram_global_assets.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Refresh hologram global navigation assets"
          git push
