name: Update hologram video heading

on:
  push:
    paths:
      - '.github/update-hologram-video-heading-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  update-heading:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace watch video heading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive-hologram/index.html')
          text = path.read_text(encoding='utf-8')
          old = 'See how the hologram experience helps audiences connect with Sonia’s story.'
          new = 'Watch the explainer video below to see how the hologram experience works.'
          if old not in text:
              raise SystemExit('Original heading not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Update hologram explainer video heading"
          git push
