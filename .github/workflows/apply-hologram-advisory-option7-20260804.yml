name: Apply hologram advisory option 7

on:
  push:
    paths:
      - '.github/apply-hologram-advisory-option7-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  apply-option-7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace advisory panel with option 7
        run: python scripts/apply_hologram_advisory_option7.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.js
          git commit -m "Apply advisory panel option 7 to hologram page"
          git push
