name: Align desktop header breakpoint

on:
  push:
    paths:
      - '.github/align-desktop-header-breakpoint-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  align-breakpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align desktop header breakpoint
        run: python scripts/align_desktop_header_breakpoint.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout-base.js global-layout.js interactive-hologram/index.html
          git commit -m "Align desktop header breakpoint"
          git push
