name: Rebuild desktop header with white logo

on:
  push:
    paths:
      - '.github/rebuild-desktop-header-white-logo-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  rebuild-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild desktop header
        run: python scripts/rebuild_desktop_header_with_white_logo.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout-base.js global-layout.css global-layout.js interactive-hologram/index.html
          git commit -m "Rebuild desktop header with white logo"
          git push
