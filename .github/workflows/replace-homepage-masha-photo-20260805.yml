name: Replace homepage Masha photo

on:
  push:
    paths:
      - '.github/replace-homepage-masha-photo-trigger-20260805.txt'

permissions:
  contents: write

jobs:
  replace-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace homepage Masha image
        run: python scripts/replace_homepage_masha_photo.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.js index.html
          git commit -m "Replace homepage Masha Pearl photo"
          git push
