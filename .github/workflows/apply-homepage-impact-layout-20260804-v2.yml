name: Apply homepage impact layout

on:
  push:
    paths:
      - '.github/homepage-impact-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply two-column impact section
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          new_section = '''<!-- Section 3: Impact and Direct Support -->
<section class="py-20 md:py-24 bg-surface-container-low">
<div class="max-w-7xl mx-auto px-6">
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-stretch">
<div class="bg-primary text-on-primary rounded-[28px] p-8 md:p-12 shadow-xl shadow-primary/10">
<span class="label-md font-label text-primary-fixed uppercase tracking-[0.18em] mb-4 block">The Blue Card</span>
<h2 class="font-headline text-4xl md:text-5xl font-extrabold mb-10">Our Impact</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
<div class="bg-white/10 border border-white/15 rounded-2xl p-6">
<span class="material-symbols-outlined text-4xl mb-5" aria-hidden="true">groups</span>
<div class="font-headline text-3xl font-extrabold mb-2">3,000+</div>
<p class="text-on-primary/85 leading-relaxed">Survivor Households Served</p>
</div>
<div class="bg-white/10 border border-white/15 rounded-2xl p-6">
<span class="material-symbols-outlined text-4xl mb-5" aria-hidden="true">map</span>
<div class="font-headline text-3xl font-extrabold mb-2">35 States</div>
<p class="text-on-primary/85 leading-relaxed">Operating across the country</p>
</div>
<div class="bg-white/10 border border-white/15 rounded-2xl p-6">
<span class="material-symbols-outlined text-4xl mb-5" aria-hidden="true">payments</span>
<div class="font-headline text-3xl font-extrabold mb-2">$2.23M</div>
<p class="text-on-primary/85 leading-relaxed">Distributed in 2025</p>
</div>
<div class="bg-white/10 border border-white/15 rounded-2xl p-6">
<span class="material-symbols-outlined text-4xl mb-5" aria-hidden="true">volunteer_activism</span>
<div class="font-headline text-3xl font-extrabold mb-2">100%</div>
<p class="text-on-primary/85 leading-relaxed">Of individual donations reach survivors</p>
</div>
</div>
</div>
<div class="bg-surface-container-lowest rounded-[28px] p-8 md:p-12 ghost-border shadow-xl shadow-primary/5 flex flex-col justify-center">
<span class="label-md font-label text-primary uppercase tracking-[0.18em] mb-4 block">Why Our Work Matters</span>
<h2 class="font-headline text-4xl md:text-5xl font-extrabold text-primary mb-7">Direct Support. Preserved Dignity.</h2>
<p class="text-on-surface-variant text-lg leading-8 mb-6">Having endured unimaginable loss and persecution during the Holocaust, many survivors continue to face hardship today. The Blue Card helps ensure that Holocaust survivors in need can live their final years with the dignity they deserve.</p>
<p class="text-on-surface-variant text-lg leading-8">Since 1934, the Blue Card has been the only U.S. nonprofit dedicated solely to providing direct financial assistance to Holocaust survivors in need, helping them afford essentials like food, healthcare, and daily living support.</p>
</div>
</div>
</div>
</section>
'''

          start = '<!-- Section 3: Mission Blue Band -->'
          end = '<!-- Section 6: Programs (Carousel) -->'
          if start not in text or end not in text:
              raise SystemExit('Expected homepage section markers were not found.')

          before, remainder = text.split(start, 1)
          _, after = remainder.split(end, 1)
          path.write_text(before + new_section + end + after, encoding='utf-8')
          PY

      - name: Commit homepage layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild homepage impact and direct support section"
          git push
