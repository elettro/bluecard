name: Finish NYC proclamation relocation

on:
  push:
    paths:
      - '.github/workflows/move-nyc-proclamation-images.yml'

permissions:
  contents: write

jobs:
  finish-relocation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repoint Who We Are gallery and remove one-time workflow
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          path = Path('who-we-are/index.html')
          text = path.read_text()
          text = text.replace('/bluecard/images/bluecard-nyc-proclamation---%20(', '/bluecard/images/nyc-promclamation/bluecard-nyc-proclamation---%20(')
          path.write_text(text)
          PY
          git rm .github/workflows/move-nyc-proclamation-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add who-we-are/index.html
          git commit -m "Repoint NYC proclamation gallery to dedicated image folder"
          git push
