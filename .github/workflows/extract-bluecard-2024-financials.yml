name: Publish Blue Card separate 2024 financial filings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-bluecard-2024-financials.yml'
permissions:
  contents: write
jobs:
  extract-approved-2024-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install PDF splitting library
        run: python3 -m pip install -q pypdf
      - name: Extract approved audit and CHAR500 only from existing combined filing
        shell: bash
        run: |
          python3 - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path
          src=Path('pdfs/Audit-990-and-Char500-The-Blue-Card.pdf')
          r=PdfReader(str(src))
          assert len(r.pages)==49, f'Unexpected combined file page count: {len(r.pages)}'
          audit_first=(r.pages[0].extract_text() or '')
          audit_final=(r.pages[13].extract_text() or '')
          char_first=(r.pages[44].extract_text() or '')
          assert 'DECEMBER 31, 2024' in audit_first, 'Audit cover identity mismatch'
          assert 'FINANCIAL' in audit_first, 'Audit cover title mismatch'
          assert 'NOTES TO FINANCIAL' in audit_final, 'Audit ending page mismatch'
          assert 'CHAR500' in char_first and '2024' in char_first, 'CHAR500 identity mismatch'
          for dest,indices,title in [
             ('pdfs/Blue-Card-2024-Audited-Financial-Statements.pdf',range(0,14),'The Blue Card - 2024 Audited Financial Statements'),
             ('pdfs/Blue-Card-2024-CHAR500.pdf',range(44,49),'The Blue Card - 2024 CHAR500'),
          ]:
              w=PdfWriter()
              for n in indices: w.add_page(r.pages[n])
              w.add_metadata({'/Title':title})
              with open(dest,'wb') as f: w.write(f)
              reread=PdfReader(dest)
              assert len(reread.pages)==len(indices)
              print(f'CREATED {dest} pages={len(indices)} bytes={Path(dest).stat().st_size}')
          PY
      - name: Commit extracted filings to staging GitHub repository
        shell: bash
        run: |
          git config user.name "Blue Card site maintenance"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/Blue-Card-2024-Audited-Financial-Statements.pdf pdfs/Blue-Card-2024-CHAR500.pdf
          if git diff --cached --quiet; then
             echo "Exact extracted files already committed"
          else
             git commit -m "Publish separate 2024 audit and CHAR500 PDFs from approved combined filing"
             git push origin HEAD:main
          fi
