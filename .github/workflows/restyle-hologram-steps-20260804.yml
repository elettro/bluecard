name: Restyle hologram program steps

on:
  push:
    paths:
      - '.github/restyle-hologram-steps-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  update-steps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restyle three program steps
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('global-layout.js')
          text = path.read_text(encoding='utf-8')

          css_marker = '''</style>
<div class="bc-container">'''
          css_override = '''.bc-history-tech .bc-history-steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:34px;padding:8px clamp(30px,5vw,58px) clamp(40px,5vw,62px)}.bc-history-tech .bc-history-step{min-height:0;padding:0;border:0;border-radius:0;background:transparent;text-align:center;box-shadow:none}.bc-history-tech .bc-history-step-top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:16px;color:#294ca4}.bc-history-tech .bc-history-step-icon{width:62px;height:62px;display:block;flex:0 0 auto}.bc-history-tech .bc-history-step-label{font-size:clamp(25px,2.6vw,36px);font-weight:900;line-height:1;letter-spacing:-.025em;text-transform:uppercase}.bc-history-tech .bc-history-step-copy{min-height:126px;display:flex;align-items:center;justify-content:center;padding:20px 22px;border-radius:15px;background:#a71920;color:#fff;font-size:17px;font-weight:800;line-height:1.38;box-shadow:0 12px 28px rgba(126,15,22,.18)}.bc-history-tech .bc-history-step-copy em{color:inherit}.bc-history-tech .bc-history-step:hover .bc-history-step-copy{transform:translateY(-2px);box-shadow:0 16px 34px rgba(126,15,22,.24)}.bc-history-tech .bc-history-step-copy{transition:transform .2s ease,box-shadow .2s ease}@media(max-width:820px){.bc-history-tech .bc-history-steps{grid-template-columns:1fr;gap:30px}.bc-history-tech .bc-history-step-copy{min-height:0}.bc-history-tech .bc-history-step-top{margin-bottom:12px}}
</style>
<div class="bc-container">'''

          if '.bc-history-step-top{' not in text:
              if css_marker not in text:
                  raise SystemExit('CSS insertion marker not found')
              text = text.replace(css_marker, css_override, 1)

          pattern = re.compile(
              r'    <div class="bc-history-steps" aria-label="Interactive Holocaust education program steps">.*?    </div>\n\n    <div class="bc-history-pillars"',
              re.S,
          )

          replacement = '''    <div class="bc-history-steps" aria-label="Interactive Holocaust education program steps">
      <article class="bc-history-step">
        <div class="bc-history-step-top">
          <svg class="bc-history-step-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M4 32s10-16 28-16 28 16 28 16-10 16-28 16S4 32 4 32Z" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="32" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="4"/><path d="M15 13l4 6M32 8v7M49 13l-4 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <span class="bc-history-step-label">Step 1</span>
        </div>
        <div class="bc-history-step-copy">View <em>Big Sonia</em>, a powerful documentary about survivor Sonia Warshawski.</div>
      </article>
      <article class="bc-history-step">
        <div class="bc-history-step-top">
          <svg class="bc-history-step-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M8 14h34a10 10 0 0 1 10 10v10a10 10 0 0 1-10 10H26L15 54V44H8A8 8 0 0 1 0 36V22a8 8 0 0 1 8-8Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="20" cy="29" r="3" fill="currentColor"/><circle cx="30" cy="29" r="3" fill="currentColor"/><circle cx="40" cy="29" r="3" fill="currentColor"/></svg>
          <span class="bc-history-step-label">Step 2</span>
        </div>
        <div class="bc-history-step-copy">Interact with Sonia’s story through a lifelike hologram experience.</div>
      </article>
      <article class="bc-history-step">
        <div class="bc-history-step-top">
          <svg class="bc-history-step-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M28 6c-12 0-21 9-21 21 0 8 4 14 10 18v9h22v-8c6-4 10-11 10-19C49 15 40 6 28 6Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M20 54v5h16v-5M53 10v8M49 14h8M51 29l6 4M45 3l4 6" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><circle cx="28" cy="27" r="6" fill="none" stroke="currentColor" stroke-width="4"/><path d="M28 17v4M28 33v4M18 27h4M34 27h4" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
          <span class="bc-history-step-label">Step 3</span>
        </div>
        <div class="bc-history-step-copy">Discuss lessons on empathy, antisemitism, and standing up to hate.</div>
      </article>
    </div>

    <div class="bc-history-pillars"'''

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Steps block matched {count} times')

          path.write_text(updated, encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-layout.js
          git commit -m "Restyle hologram program steps to match reference"
          git push
