name: Rebuild hologram endorsement letters

on:
  push:
    paths:
      - '.github/rebuild-hologram-endorsement-letters-trigger-20260804.txt'

permissions:
  contents: write

jobs:
  rebuild-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace endorsement viewer with card gallery and modal
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('interactive-hologram/index.html')
          text = path.read_text(encoding='utf-8')

          start_marker = '    <section class="bc-endorsement-documents-section">'
          end_marker = '    <section class="bc-final-cta"'

          start = text.find(start_marker)
          end = text.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit(f'Could not locate endorsement section markers: start={start}, end={end}')

          replacement = r'''    <section class="bc-endorsement-documents-section bc-endorsement-gallery" id="endorsement-letters">
      <style>
        body.bc-letter-modal-open{overflow:hidden}
        .bc-endorsement-gallery{background:#eef2f8;padding:78px 0 90px;color:#1b2a57}
        .bc-endorsement-gallery .bc-endorsement-documents-wrap{width:min(1360px,calc(100% - 48px));margin:0 auto}
        .bc-endorsement-gallery .bc-endorsement-documents-eyebrow{display:block;margin-bottom:14px;color:#26469a;font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
        .bc-endorsement-gallery .bc-endorsement-documents-title{max-width:980px;margin:0;color:#16244d;font-size:clamp(38px,4.8vw,62px);font-weight:900;line-height:1.02;letter-spacing:-.03em}
        .bc-endorsement-gallery .bc-endorsement-documents-intro{max-width:760px;margin:16px 0 0;color:#5b6c95;font-size:18px;line-height:1.6}
        .bc-letter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-top:42px}
        .bc-letter-card{appearance:none;display:flex;min-width:0;flex-direction:column;overflow:hidden;padding:0;border:1px solid #d7deed;border-radius:20px;background:#fff;color:#1b2a57;text-align:left;cursor:pointer;box-shadow:0 16px 38px rgba(20,42,89,.08);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
        .bc-letter-card:hover,.bc-letter-card:focus-visible{transform:translateY(-4px);border-color:#5f7bc4;box-shadow:0 22px 48px rgba(20,42,89,.14);outline:none}
        .bc-letter-preview{position:relative;aspect-ratio:8.5/11;overflow:hidden;background:#f5f7fb;border-bottom:1px solid #e3e8f2}
        .bc-letter-preview iframe{display:block;width:100%;height:100%;border:0;pointer-events:none;background:#fff}
        .bc-letter-preview:after{content:'View Letter';position:absolute;right:14px;bottom:14px;padding:8px 11px;border-radius:999px;background:rgba(22,36,77,.9);color:#fff;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;box-shadow:0 8px 18px rgba(0,0,0,.18)}
        .bc-letter-card-title{padding:18px 18px 20px;color:#16244d;font-size:17px;font-weight:900;line-height:1.25}
        .bc-letter-modal[hidden]{display:none}
        .bc-letter-modal{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;padding:20px;background:rgba(8,18,42,.74);backdrop-filter:blur(7px)}
        .bc-letter-dialog{display:flex;width:min(1180px,calc(100vw - 40px));height:min(900px,calc(100vh - 40px));flex-direction:column;overflow:hidden;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:#fff;box-shadow:0 34px 90px rgba(0,0,0,.36)}
        .bc-letter-dialog-bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:15px 18px;border-bottom:1px solid #dfe5f0;background:linear-gradient(180deg,#fff,#f7f9fd)}
        .bc-letter-dialog-title{min-width:0;margin:0;color:#16244d;font-size:20px;font-weight:900;line-height:1.2}
        .bc-letter-dialog-actions{display:flex;align-items:center;gap:10px;flex:0 0 auto}
        .bc-letter-download,.bc-letter-close{display:inline-flex;align-items:center;justify-content:center;border-radius:11px;font-weight:900;text-decoration:none}
        .bc-letter-download{min-height:42px;padding:0 15px;background:#24489e;color:#fff;font-size:13px}
        .bc-letter-download:hover,.bc-letter-download:focus-visible{background:#17306f}
        .bc-letter-close{width:42px;height:42px;padding:0;border:1px solid #d8dfec;background:#fff;color:#16244d;font-size:26px;line-height:1;cursor:pointer}
        .bc-letter-close:hover,.bc-letter-close:focus-visible{border-color:#9fb0d4;background:#eef3fb;outline:none}
        .bc-letter-modal-frame{display:block;width:100%;height:100%;flex:1;border:0;background:#e8ecf3}
        @media(max-width:1000px){.bc-letter-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
        @media(max-width:620px){.bc-endorsement-gallery{padding:64px 0 72px}.bc-endorsement-gallery .bc-endorsement-documents-wrap{width:min(100% - 24px,1360px)}.bc-letter-grid{grid-template-columns:1fr}.bc-letter-modal{padding:8px}.bc-letter-dialog{width:calc(100vw - 16px);height:calc(100vh - 16px);border-radius:16px}.bc-letter-dialog-bar{align-items:flex-start}.bc-letter-dialog-title{font-size:16px}.bc-letter-download{padding:0 11px;font-size:12px}.bc-letter-preview{aspect-ratio:8.5/10.5}}
      </style>

      <div class="bc-endorsement-documents-wrap">
        <span class="bc-endorsement-documents-eyebrow">Program Endorsements</span>
        <h2 class="bc-endorsement-documents-title">Endorsement Letters</h2>
        <p class="bc-endorsement-documents-intro">Select any letter to open a full-size viewer. Each document also includes a download option.</p>

        <div class="bc-letter-grid" aria-label="Endorsement letters">
          <button class="bc-letter-card" type="button" data-src="/bluecard/images/interactive-hologram/L-Petlakh-Endorsement-letter.pdf" data-title="L. Petlakh Endorsement Letter">
            <span class="bc-letter-preview"><iframe src="/bluecard/images/interactive-hologram/L-Petlakh-Endorsement-letter.pdf#page=1&view=Fit&toolbar=0&navpanes=0&scrollbar=0" title="Preview of L. Petlakh endorsement letter" loading="lazy"></iframe></span>
            <span class="bc-letter-card-title">L. Petlakh</span>
          </button>

          <button class="bc-letter-card" type="button" data-src="/bluecard/images/interactive-hologram/A-School-Without-Walls-Endorsement-Letter.pdf" data-title="A School Without Walls Endorsement Letter">
            <span class="bc-letter-preview"><iframe src="/bluecard/images/interactive-hologram/A-School-Without-Walls-Endorsement-Letter.pdf#page=1&view=Fit&toolbar=0&navpanes=0&scrollbar=0" title="Preview of A School Without Walls endorsement letter" loading="lazy"></iframe></span>
            <span class="bc-letter-card-title">A School Without Walls</span>
          </button>

          <button class="bc-letter-card" type="button" data-src="https://bluecardfund.org/wp-content/uploads/2026/02/Bluecard-Program-1.pdf" data-title="Blue Card Program Endorsement Letter">
            <span class="bc-letter-preview"><iframe src="https://bluecardfund.org/wp-content/uploads/2026/02/Bluecard-Program-1.pdf#page=1&view=Fit&toolbar=0&navpanes=0&scrollbar=0" title="Preview of Blue Card program endorsement letter" loading="lazy"></iframe></span>
            <span class="bc-letter-card-title">Program Endorsement</span>
          </button>

          <button class="bc-letter-card" type="button" data-src="https://bluecardfund.org/wp-content/uploads/2026/01/M-Adams-Endorsement-Letter.pdf" data-title="M. Adams Endorsement Letter">
            <span class="bc-letter-preview"><iframe src="https://bluecardfund.org/wp-content/uploads/2026/01/M-Adams-Endorsement-Letter.pdf#page=1&view=Fit&toolbar=0&navpanes=0&scrollbar=0" title="Preview of M. Adams endorsement letter" loading="lazy"></iframe></span>
            <span class="bc-letter-card-title">M. Adams</span>
          </button>
        </div>
      </div>

      <div class="bc-letter-modal" id="bcLetterModal" hidden aria-hidden="true">
        <div class="bc-letter-dialog" role="dialog" aria-modal="true" aria-labelledby="bcLetterModalTitle">
          <div class="bc-letter-dialog-bar">
            <h3 class="bc-letter-dialog-title" id="bcLetterModalTitle">Endorsement Letter</h3>
            <div class="bc-letter-dialog-actions">
              <a class="bc-letter-download" id="bcLetterDownload" href="#" target="_blank" rel="noopener" download>Download PDF</a>
              <button class="bc-letter-close" id="bcLetterClose" type="button" aria-label="Close endorsement letter viewer">×</button>
            </div>
          </div>
          <iframe class="bc-letter-modal-frame" id="bcLetterModalFrame" title="Endorsement letter document viewer"></iframe>
        </div>
      </div>

      <script>
        (function(){
          var section=document.getElementById('endorsement-letters');
          var modal=document.getElementById('bcLetterModal');
          var frame=document.getElementById('bcLetterModalFrame');
          var title=document.getElementById('bcLetterModalTitle');
          var download=document.getElementById('bcLetterDownload');
          var close=document.getElementById('bcLetterClose');
          var lastTrigger=null;

          if(!section||!modal||!frame||!title||!download||!close)return;

          function openLetter(card){
            var src=card.getAttribute('data-src');
            var label=card.getAttribute('data-title')||'Endorsement Letter';
            lastTrigger=card;
            title.textContent=label;
            download.href=src;
            frame.src=src+'#page=1&view=FitH&toolbar=1&navpanes=0';
            modal.hidden=false;
            modal.setAttribute('aria-hidden','false');
            document.body.classList.add('bc-letter-modal-open');
            window.setTimeout(function(){close.focus();},0);
          }

          function closeLetter(){
            if(modal.hidden)return;
            modal.hidden=true;
            modal.setAttribute('aria-hidden','true');
            frame.src='about:blank';
            document.body.classList.remove('bc-letter-modal-open');
            if(lastTrigger)lastTrigger.focus();
          }

          section.querySelectorAll('.bc-letter-card').forEach(function(card){
            card.addEventListener('click',function(){openLetter(card);});
          });

          close.addEventListener('click',closeLetter);
          modal.addEventListener('click',function(event){if(event.target===modal)closeLetter();});
          document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!modal.hidden)closeLetter();});
        })();
      </script>
    </section>'''

          path.write_text(text[:start] + replacement + '\n\n' + text[end:], encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interactive-hologram/index.html
          git commit -m "Rebuild hologram endorsement letters section"
          git push
