name: Apply homepage final CTA copy

on:
  push:
    paths:
      - '.github/homepage-final-cta-trigger-20260804.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace homepage final CTA heading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'These are living survivors.<br/>They still need our help.'
          new = 'Your support enables Holocaust survivors to live with dignity.'

          if old not in text:
              raise SystemExit('Final CTA heading not found.')

          text = text.replace(old, new, 1)

          if new not in text:
              raise SystemExit('Replacement heading was not written.')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit homepage final CTA update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update homepage final CTA message"
          git push
