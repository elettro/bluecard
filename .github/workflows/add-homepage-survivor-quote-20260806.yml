name: Add homepage survivor quote

on:
  push:
    paths:
      - '.github/add-homepage-survivor-quote-trigger-20260806.txt'

permissions:
  contents: write

jobs:
  add-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add survivor quote after homepage introduction
        run: python scripts/add_homepage_quote.py
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add survivor quote to homepage introduction"
          git push
