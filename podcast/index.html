  <meta charset="UTF-8" />

  <title>Podcast | The Blue Card</title>
  <style>
    :root {
      --blue: #0057a8;
      --blue-dark: #0b4f9c;
      --ink: #0e1c2f;
      --paper: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #eef3fb;
      line-height: 1.5;
    }
    .hero {
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #0b4f9c 0%, #0057a8 62%, #164f8f 100%);
      color: #fff;
      padding: 70px 20px 76px;
    }
    .hero::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      right: -150px;
      top: -210px;
      border-radius: 50%;
      background: rgba(255,255,255,.06);
      pointer-events: none;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
    }
    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: #dcecff;
    }
    .eyebrow::before {
      content: "";
      width: 34px;
      height: 2px;
      background: #ffffff;
      border-radius: 999px;
    }
    h1 {
      max-width: 940px;
      margin: 0 0 18px;
      font-size: clamp(2.5rem, 5.4vw, 4.5rem);
      line-height: .98;
      letter-spacing: -.025em;
      text-transform: none;
      font-weight: 800;
    }
    .subtitle {
      margin: 0;
      max-width: 720px;
      font-size: clamp(1.1rem, 2.2vw, 1.5rem);
      line-height: 1.45;
      color: #eef6ff;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 30px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 2px solid #fff;
      border-radius: 8px;
      color: var(--blue-dark);
      background: #fff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      box-shadow: 0 10px 24px rgba(0,0,0,.14);
      transition: transform .2s ease, background-color .2s ease, color .2s ease;
    }
    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      background: #eef6ff;
    }
    .cta.anchor {
      color: #fff;
      background: transparent;
      box-shadow: none;
    }
    .cta.anchor:hover,
    .cta.anchor:focus-visible {
      color: var(--blue-dark);
      background: #fff;
    }
    main { padding: 36px 20px 56px; }
    .logo-card {
      max-width: 1080px;
      margin: 0 auto 24px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 28px rgba(0,0,0,.12);
      background: #fff;
    }
    .logo-card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .episodes { display: grid; gap: 18px; }
    .embed {
      background: var(--paper);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(13,87,168,.12);
    }
    iframe { width: 100%; max-width: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 700px) {
      .hero { padding: 54px 20px 58px; }
      h1 { font-size: clamp(2.3rem, 12vw, 3.5rem); }
      .cta-row { flex-direction: column; align-items: stretch; }
      .cta { width: 100%; }
    }
  </style>
