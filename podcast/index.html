      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 2px solid var(--blue-dark);
      border-radius: 8px;
      color: #fff;
      background: var(--blue-dark);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      transition: transform .2s ease, background-color .2s ease, color .2s ease;
    }
    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      background: var(--blue);
      border-color: var(--blue);
    }
    .cta.anchor {
      color: var(--blue-dark);
      background: #fff;
    }
    .cta.anchor:hover,
    .cta.anchor:focus-visible {
      color: #fff;
      background: var(--blue-dark);
    }
    .episodes { display: grid; gap: 18px; }
    .embed {
      background: var(--paper);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(13,87,168,.12);
    }
    iframe { width: 100%; max-width: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 700px) {

      .podcast-intro { padding: 24px 20px; }
      .cta-row { flex-direction: column; align-items: stretch; }
      .cta { width: 100%; }
