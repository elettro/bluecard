<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Blue Card Podcast</title>
  <style>
    :root {
      --blue: #0d57a8;
      --ink: #0e1c2f;
      --paper: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: #eef3fb;
      line-height: 1.5;
    }
    .hero {
      background:
        linear-gradient(135deg, rgba(15, 93, 178, 0.92), rgba(11, 74, 140, 0.9)),
        url("/bluecard/images/podcast/header-podcast-background.jpg") center / cover no-repeat;
      color: #fff;
      padding: 48px 20px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 12px; letter-spacing: .06em; text-transform: uppercase; }
    .subtitle { font-size: clamp(1.05rem, 2.4vw, 1.6rem); max-width: 680px; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .cta {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
      padding: 12px 20px;
      color: white;
      background: #1db954;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }
    .cta.anchor { background: #7c3aed; }
    main { padding: 30px 20px 56px; }
    .logo-card {
      max-width: 420px;
      margin: 0 auto 24px;
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
    }
    .episodes { display: grid; gap: 18px; }
    .embed {
      background: var(--paper);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(13,87,168,.12);
    }
    iframe { width: 100%; max-width: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 860px){ .hero-grid { grid-template-columns: 1fr; } }
  </style>
  <link rel="stylesheet" href="../global-layout.css"/>
</head>
<body>
  <div id="bc-global-nav"></div>

  <header class="hero">
    <div class="wrap hero-grid">
      <div>
        <p style="letter-spacing:.18em; text-transform:uppercase; margin:0 0 8px;">Play now</p>
        <h1>The Blue Card Podcast</h1>
        <p class="subtitle">The Blue Card Stories of the Holocaust: Overcoming Historical Trauma.</p>
        <div class="cta-row">
          <a class="cta" href="https://open.spotify.com/episode/4Vc1eV5qdINfvpPWjTAv7T?si=311RHEXKQyu83gHnYfPIKA&nd=1" target="_blank" rel="noopener noreferrer">Listen on Spotify</a>
          <a class="cta anchor" href="https://anchor.fm/blue-card" target="_blank" rel="noopener noreferrer">Listen on Anchor.fm</a>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="wrap">
      <section class="episodes" aria-label="Podcast episodes">
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/1cXc2HM35a3BaqwAhsIEIl/video?utm_source=generator" width="624" height="351" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/7ew6mPmDeklHamUpsGWBjj?utm_source=generator" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/4aR3Tp6qDI3z7fH4LaXOx9/video?utm_source=generator" width="624" height="351" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/3hS2tS0r7Ypjk7u9JDPlj8/video?utm_source=generator" width="624" height="351" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/2EpqrXIs4flwB2cPI2v4Pf/video?utm_source=generator" width="624" height="351" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/5XrZeQueuioMLo9PvwHDHt/video?utm_source=generator" width="624" height="351" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/0UMXOGjCU4v0NlPbXVzIHo?utm_source=generator" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
        <div class="embed"><iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/episode/4Vc1eV5qdINfvpPWjTAv7T?utm_source=generator" width="100%" height="352" frameborder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe></div>
      </section>
    </div>
  </main>

  <div id="bc-global-footer"></div>
  <script src="../global-layout.js"></script>
</body>
</html>
