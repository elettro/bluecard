  <style>
    :root {
      --blue: #0d57a8;
      --ink: #0e1c2f;
      --paper: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: #eef3fb;
      line-height: 1.5;
    }
    .hero {
      background: linear-gradient(135deg, rgba(15, 93, 178, 0.92), rgba(11, 74, 140, 0.9));
      color: #fff;
      padding: 48px 20px;
    }
    .wrap { max-width: 1080px; margin: 0 auto; }
    .hero-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: center;
    }
    h1 { font-size: clamp(2rem, 6vw, 4rem); margin: 0 0 12px; letter-spacing: .06em; text-transform: uppercase; }
    .subtitle { font-size: clamp(1.05rem, 2.4vw, 1.6rem); max-width: 680px; }
    .cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
    .cta {
      display: inline-block;
      text-decoration: none;
      font-weight: 700;
      border-radius: 999px;
      padding: 12px 20px;
      color: white;
      background: #1db954;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
    }
    .cta.anchor { background: #7c3aed; }
    main { padding: 30px 20px 56px; }
    .logo-card {
      max-width: 1080px;
      margin: 0 auto 24px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,.12);
      background: #fff;
    }
    .logo-card img {
      display: block;
      width: 100%;
      height: auto;
    }
    .episodes { display: grid; gap: 18px; }
    .embed {
      background: var(--paper);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(13,87,168,.12);
    }
    iframe { width: 100%; max-width: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 860px){ .hero-grid { grid-template-columns: 1fr; } }
