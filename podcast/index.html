  <style>
    :root {
      --blue: #0057a8;
      --blue-dark: #0b4f9c;
      --ink: #0e1c2f;
      --paper: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #eef3fb;
      line-height: 1.5;
    }
    .hero {
      width: 100%;
      height: clamp(380px, 22vw, 450px);
      background: #0b4f9c;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      margin: 0 auto;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    main { padding: 42px 20px 56px; }
    .podcast-intro {
      max-width: 1080px;
      margin: 0 auto 28px;
      padding: 30px 32px;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 24px rgba(13,87,168,.10);
      border: 1px solid rgba(13,87,168,.10);
    }
    .subtitle {
      margin: 0;
      max-width: 820px;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      line-height: 1.5;
      color: #344b66;
    }
    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 22px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 22px;
      border: 2px solid var(--blue-dark);
      border-radius: 8px;
      color: #fff;
      background: var(--blue-dark);
      text-decoration: none;
      font-size: 15px;
      font-weight: 800;
      transition: transform .2s ease, background-color .2s ease, color .2s ease;
    }
    .cta:hover,
    .cta:focus-visible {
      transform: translateY(-2px);
      background: var(--blue);
      border-color: var(--blue);
    }
    .cta.anchor {
      color: var(--blue-dark);
      background: #fff;
    }
    .cta.anchor:hover,
    .cta.anchor:focus-visible {
      color: #fff;
      background: var(--blue-dark);
    }
    .episodes { display: grid; gap: 18px; }
    .embed {
      background: var(--paper);
      border-radius: 14px;
      padding: 12px;
      box-shadow: 0 8px 18px rgba(13,87,168,.12);
    }
    iframe { width: 100%; max-width: 100%; border: 0; border-radius: 12px; }
    @media (max-width: 700px) {
      .hero { height: 260px; }
      .hero img { object-position: center; }
      main { padding: 28px 14px 48px; }
      .podcast-intro { padding: 24px 20px; }
      .cta-row { flex-direction: column; align-items: stretch; }
      .cta { width: 100%; }
    }
  </style>
