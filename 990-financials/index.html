<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>990 Financials | The Blue Card</title>
  <link rel="stylesheet" href="../global-layout.css" />
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #1f2a37;
      background: #f3f5f7;
    }

    .page-wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 28px auto 56px;
      background: #ffffff;
      border: 1px solid #d6dde6;
      border-radius: 10px;
      padding: clamp(18px, 2.4vw, 28px);
      box-sizing: border-box;
      box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
    }

    h1 {
      margin: 0 0 10px;
      color: #0b56a4;
      font-size: clamp(1.7rem, 3vw, 2.2rem);
    }

    p {
      margin: 0 0 18px;
      line-height: 1.55;
    }

    .actions {
      margin: 0 0 16px;
    }

    .download-btn {
      display: inline-block;
      background: #0b56a4;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
      padding: 11px 16px;
    }

    .download-btn:hover,
    .download-btn:focus-visible {
      background: #094785;
    }

    .pdf-viewer {
      width: 100%;
      height: min(75vh, 920px);
      border: 1px solid #c9d4e2;
      border-radius: 8px;
      background: #fff;
    }
  </style>
</head>
<body>
  <header id="bc-global-nav" aria-label="Global site navigation"></header>

  <main class="page-wrap">
    <h1>Form 990 Financials</h1>
    <p>View or download The Blue Card Audit, 990, and Char500 filing.</p>

    <div class="actions">
      <a class="download-btn" href="../pdfs/Audit-990-and-Char500-The-Blue-Card.pdf" download>
        Download the PDF
      </a>
    </div>

    <iframe
      class="pdf-viewer"
      src="../pdfs/Audit-990-and-Char500-The-Blue-Card.pdf"
      title="Audit, 990, and Char500 - The Blue Card"
    ></iframe>
  </main>

  <footer id="bc-global-footer" aria-label="Global site footer"></footer>
  <script src="../global-layout.js"></script>
</body>
</html>
