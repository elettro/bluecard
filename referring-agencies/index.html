<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Referring Social Service Agencies | The Blue Card</title>
  <link rel="stylesheet" href="../global-layout.css" />
  <style>body { margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 15px; color: #222; background: #efefef; }
.header-strip { background: #0b56a4; color: #fff; padding: 26px 16px; text-align: center; font-weight: 700; font-size: clamp(24px, 4vw, 34px); }
.header-strip small { display:block; margin-top:6px; font-size:clamp(18px,3vw,24px); font-weight:600; }
.page-wrap{ width:min(1100px,calc(100% - 32px)); margin:30px auto 70px;}
.search-wrap{display:flex;gap:8px;margin-bottom:16px;} .search-wrap input{flex:1;padding:8px 12px;border:1px solid #b8cde0;border-radius:4px;}
.controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;} button{background:none;border:1px solid #0057a8;color:#0057a8;padding:5px 14px;border-radius:3px;cursor:pointer;}
button:hover{background:#0057a8;color:#fff;} #resultCount{font-size:13px;color:#666;margin-left:auto;}
.region{background:#fff;border:1px solid #d0dce8;border-radius:5px;margin-bottom:6px;overflow:hidden;} .region-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;gap:10px;}
.region-header.open{background:#e8f1fb;} .region-name{font-weight:bold;font-size:14px;color:#0d2f57;flex:1;} .region-count{font-size:12px;color:#888;background:#edf2f7;padding:2px 8px;border-radius:12px;}
.chevron{width:16px;height:16px;fill:none;stroke:#0057a8;stroke-width:2.5;transition:transform .2s;} .region-header.open .chevron{transform:rotate(180deg);} .region-body{display:none;border-top:1px solid #d0dce8;padding:4px 0 8px;} .region-body.open{display:block;}
.agency{display:flex;align-items:baseline;padding:6px 16px 6px 20px;gap:8px;} .agency-city{font-size:13px;color:#555;min-width:140px;} .agency-name a{color:#0057a8;text-decoration:none;font-size:13.5px;font-weight:600;}
.cta-group{margin-top:24px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));}.cta-btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;padding:14px 16px;border-radius:999px;background:#0b56a4;color:#fff;font-weight:700;text-decoration:none;}</style>
</head>
