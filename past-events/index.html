  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.08);
      --shadow-hover: 0 10px 24px rgba(15, 23, 42, 0.14);
      --radius: 12px;
      --gap: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 40px;
    }

    h1 {
      text-align: center;
      margin: 0 0 28px;
      font-size: clamp(1.75rem, 3vw, 2.25rem);
      letter-spacing: 0.2px;
    }

    .events-grid {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: var(--gap);
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    @media (max-width: 1024px) {
      .events-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .events-grid { grid-template-columns: 1fr; }
    }

    .event-card {
      display: block;
      width: 100%;
      border: 0;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      text-align: left;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
      padding: 0;
    }

    .event-card:hover,
    .event-card:focus-visible {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      outline: none;
    }

    .event-card img {
      width: 100%;
      aspect-ratio: 1 / 1.294;
      object-fit: cover;
      display: block;
      background: #e5e7eb;
    }

    .event-title {
      display: block;
      padding: 12px 12px 14px;
      font-size: 0.95rem;
      color: var(--muted);
      min-height: 62px;
    }

    .modal {
      border: 0;
      padding: 0;
      width: min(92vw, 1400px);
      max-height: 92vh;
      background: transparent;
    }

    .modal::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    .modal-content {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-image {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.35);
      background: #fff;
    }

    .modal-close {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      font-size: 1.5rem;
      line-height: 1;
      cursor: pointer;
      color: #111827;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    .modal-close:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 2px;
    }
  </style>

    ];

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('eventsGrid');
      const modal = document.getElementById('imageModal');
      const modalImage = document.getElementById('modalImage');
      const modalTitle = document.getElementById('modalTitle');
      const modalClose = document.getElementById('modalClose');
      let lastTrigger = null;

      const ensureOrder = [...events].sort((a, b) => b.event_id - a.event_id);

      ensureOrder.forEach((event) => {
        const li = document.createElement('li');
        let card;

        if (event.link) {
          card = document.createElement('a');
          card.href = event.link;
          card.target = event.target || '_blank';
          card.rel = 'noopener noreferrer';
        } else {
          card = document.createElement('button');
          card.type = 'button';
          card.dataset.modalImage = event.image;
          card.dataset.modalTitle = event.title;
          card.addEventListener('click', () => openModal(card));
        }

        card.className = 'event-card';

        const img = document.createElement('img');
        img.src = event.image;
        img.alt = event.title;
        img.loading = 'lazy';

        const title = document.createElement('span');
        title.className = 'event-title';
        title.textContent = event.title;

        card.appendChild(img);
        card.appendChild(title);
        li.appendChild(card);
        grid.appendChild(li);
      });

      function getFocusable(container) {
        return Array.from(container.querySelectorAll(
          'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])'
        )).filter((el) => !el.hasAttribute('disabled') && !el.getAttribute('aria-hidden'));
      }

      function trapFocus(e) {
        if (e.key !== 'Tab' || !modal.open) return;
        const focusable = getFocusable(modal);
        if (!focusable.length) return;

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      }

      function openModal(triggerEl) {
        lastTrigger = triggerEl;
        modalImage.src = triggerEl.dataset.modalImage;
        modalImage.alt = triggerEl.dataset.modalTitle;
        modalTitle.textContent = triggerEl.dataset.modalTitle;
        modal.showModal();
        modalClose.focus();
      }

      function closeModal() {
        if (!modal.open) return;
        modal.close();
        modalImage.src = '';
        modalImage.alt = '';
        if (lastTrigger) {
          lastTrigger.focus();
        }
      }

      modalClose.addEventListener('click', closeModal);

      modal.addEventListener('click', (e) => {
        const rect = modal.getBoundingClientRect();
        const inDialog = (
          e.clientX >= rect.left &&
          e.clientX <= rect.right &&
          e.clientY >= rect.top &&
          e.clientY <= rect.bottom
        );
        if (!inDialog) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.open) {
          e.preventDefault();
          closeModal();
        }
      });

      modal.addEventListener('keydown', trapFocus);
      modal.addEventListener('close', () => {
        if (lastTrigger) lastTrigger.focus();
      });
    });
