<!DOCTYPE html>

  <title>B'nei Mitzvah Simcha Project | The Blue Card</title>
  <meta name="description" content="Learn about The Blue Card's B'nei Mitzvah Simcha Project, featuring Jewish teens, Holocaust education, survivor connection, charitable giving, and support for Holocaust survivors." />
  <link rel="stylesheet" href="../global-layout.css" />
  <style>body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#18324a;background:radial-gradient(circle at top left, rgba(214,178,93,.12), transparent 26%),linear-gradient(180deg,#f7fbfe 0%,#fff 35%,#f8fbfd 100%);line-height:1.65}.container{width:min(calc(100% - 32px),1280px);margin:0 auto}.hero{position:relative;padding:78px 0 42px;background:linear-gradient(135deg,rgba(10,52,88,.97),rgba(15,76,129,.9));color:#fff}.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:30px}.section{padding:40px 0}.graphic-card,.snapshot-card,.story-card,.story-aside,.cta-card{background:#fff;border:1px solid rgba(15,76,129,.12);border-radius:28px;box-shadow:0 22px 60px rgba(10,52,88,.12)}.graphic-card,.story-card,.cta-card,.story-aside{padding:28px}.snapshot-card{padding:36px}.fade-gallery{position:relative;min-height:420px;border-radius:20px;background:linear-gradient(180deg,#edf5fa 0%,#f7fbfe 100%);border:1px solid rgba(15,76,129,.1);overflow:hidden}.fade-gallery::before{content:"";display:block;padding-top:62%}.fade-gallery img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#f6fbfe;padding:12px;opacity:0;transition:opacity .9s ease}.fade-gallery img.active{opacity:1}.snapshot-facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:26px}.fact-card,.flow-card{background:#fff;border:1px solid rgba(15,76,129,.11);border-radius:20px;padding:22px}.flow-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.story-wrap{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);gap:28px}.cta-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:28px}.contact-box{padding:24px;border-radius:22px;background:#0a3458;color:#fff}.actions{display:flex;flex-wrap:wrap;gap:14px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 22px;border-radius:999px;font-weight:700;text-decoration:none}.btn-primary{background:#d6b25d;color:#202532}.btn-secondary{color:#0a3458;background:#fff;border:1px solid rgba(15,76,129,.16)}@media(max-width:1180px){.hero-grid,.story-wrap,.cta-grid{grid-template-columns:1fr}.snapshot-facts{grid-template-columns:repeat(2,minmax(0,1fr))}.flow-grid{grid-template-columns:1fr}}@media(max-width:760px){.snapshot-facts{grid-template-columns:1fr}}</style>
</head>
<body>
<header id="bc-global-nav" aria-label="Global site navigation"></header>
<main>
<section class="hero"><div class="container"><h1>B'nei Mitzvah Simcha Project</h1><p>A meaningful way for Jewish teens and families to celebrate a simcha with deeper purpose, connect with Holocaust history, and support Holocaust survivors served by The Blue Card.</p><audio controls preload="none" style="width:100%"><source src="https://bluecardfund.org/wp-content/uploads/2026/04/Jewish_Teens_Support_Impoverished_Holocaust_Survivors.mp3" type="audio/mpeg"/></audio></div></section>
<section class="section"><div class="container"><div class="graphic-card"><h2>See the program in detail</h2><div class="fade-gallery"><img src="https://bluecardfund.org/wp-content/uploads/2026/04/bnei-mitzvah-students-infographic-theBlueCard.jpg" alt="B'nei Mitzvah Simcha Project infographic by The Blue Card" class="active"/><img src="https://bluecardfund.org/wp-content/uploads/2026/04/bnei-mitzvah-students-infographic-theBlueCard2.jpg" alt="Second B'nei Mitzvah Simcha Project infographic by The Blue Card"/></div></div></div></section>
</main>
<div id="bc-global-footer"></div>

<script>(function(){const slides=document.querySelectorAll('.fade-gallery img');if(slides.length<2)return;let current=0;setInterval(()=>{slides[current].classList.remove('active');current=(current+1)%slides.length;slides[current].classList.add('active');},4200);})();</script>
